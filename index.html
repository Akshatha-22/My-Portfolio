  <script>
    window.storage = {
      set: function (key, value) { return Promise.resolve(localStorage.setItem(key, value)); },
      get: function (key) { return Promise.resolve(localStorage.getItem(key)); },
      delete: function (key) { return Promise.resolve(localStorage.removeItem(key)); },
      list: function (prefix) {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.startsWith(prefix)) {
            keys.push(k);
          }
        }
        return Promise.resolve(keys);
      }
    };
    
    document.addEventListener('error', function(e) {
      if (e.target.tagName === 'IMG') {
        e.target.style.display = 'none';
      }
    }, true);

    (function () {

      /* ── Mini starfield on loading canvas ── */
      var lc = document.getElementById('loading-canvas');
      if (lc) {
        var ctx = lc.getContext('2d');
        lc.width = window.innerWidth;
        lc.height = window.innerHeight;
        var stars = [];
        for (var i = 0; i < 180; i++) {
          stars.push({
            x: Math.random() * lc.width,
            y: Math.random() * lc.height,
            r: Math.random() * 1.2 + 0.3,
            o: Math.random() * 0.7 + 0.2,
            speed: Math.random() * 0.3 + 0.05
          });
        }
        var loadingStarFrame;
        function drawLoadingStars() {
          ctx.clearRect(0, 0, lc.width, lc.height);
          stars.forEach(function (s) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(240,238,255,' + s.o + ')';
            ctx.fill();
            s.y -= s.speed;
            if (s.y < 0) {
              s.y = lc.height;
              s.x = Math.random() * lc.width;
            }
          });
          loadingStarFrame = requestAnimationFrame(drawLoadingStars);
        }
        drawLoadingStars();
      }



      /* ── Progress bar animation ── */
      var bar = document.getElementById('loading-progress-bar');
      var label = document.getElementById('loading-label');

      var loadingPhrases = [
        'compiling ambition...',
        'importing curiosity...',
        'deploying passion...',
        'rendering portfolio...',
        'almost there...'
      ];

      var startTime = Date.now();
      var totalDuration = 3200;

      function updateProgress() {
        var elapsed = Date.now() - startTime;
        var progress = Math.min((elapsed / totalDuration) * 100, 100);
        if (bar) bar.style.width = progress + '%';
        if (label) {
          var idx = Math.min(
            Math.floor((progress / 100) * loadingPhrases.length),
            loadingPhrases.length - 1
          );
          label.textContent = loadingPhrases[idx];
        }
        if (progress < 100) {
          requestAnimationFrame(updateProgress);
        }
      }
      setTimeout(function () { requestAnimationFrame(updateProgress); }, 1100);

      /* ── Dismiss loading screen ── */
      setTimeout(function () {
        var screen = document.getElementById('loading-screen');
        if (screen) {
          screen.style.opacity = '0';
          screen.style.visibility = 'hidden';
          setTimeout(function () {
            screen.style.display = 'none';
            if (typeof loadingStarFrame !== 'undefined') {
              cancelAnimationFrame(loadingStarFrame);
            }
          }, 800);
        }
      }, 3500);

    })();

      const domRef = useRef(null);
      const [isVisible, setVisible] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });
        const current = domRef.current;
        if (current) {
          observer.observe(current);
        }
        return () => {
          if (current) {
            observer.unobserve(current);
          }
        };
      }, []);

      return { ref: domRef, isVisible };
    };

          const geo = new THREE.SphereGeometry(blob.size, 16, 16);
          const mat = new THREE.MeshBasicMaterial({ color: blob.color, transparent: true, opacity: 0.06 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(...blob.pos);
          scene.add(mesh);
          blobMeshes.push({ geo, mat });
        });

        let mouseX = 0;
        let mouseY = 0;
        const onMouse = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 0.3;
        };
        const onResize = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          renderer.setSize(w, h);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        };
        window.addEventListener("mousemove", onMouse);
        window.addEventListener("resize", onResize);

        let frame;
        const animate = () => {
          frame = requestAnimationFrame(animate);
          scene.rotation.y += 0.00008;
          scene.rotation.x += 0.00004;
          const pos = aphGeo.attributes.position.array;
          for (let i = 0; i < aphCount; i++) {
            pos[i * 3 + 1] += 0.12;
            if (pos[i * 3 + 1] > 300) {
              pos[i * 3 + 1] = -300;
            }
          }
          aphGeo.attributes.position.needsUpdate = true;
          camera.position.x += (mouseX - camera.position.x) * 0.02;
          camera.position.y += (-mouseY - camera.position.y) * 0.02;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(frame);
          window.removeEventListener("mousemove", onMouse);
          window.removeEventListener("resize", onResize);
          renderer.dispose();
          starGeo.dispose();
          starMat.dispose();
          aphGeo.dispose();

      const prefix = str.charAt(0);
      const numberMatch = str.match(/(\d+(?:\.\d+)?)/);
      if (!numberMatch) return { prefix, number: 0, suffix: "", rest: str.slice(2), decimalPlaces: 0 };

      const numberStr = numberMatch[1];
      const number = parseFloat(numberStr);
      const decimalPlaces = numberStr.includes('.') ? numberStr.split('.')[1].length : 0;
      const endOfNumber = numberMatch.index + numberStr.length;
      const afterNumber = str.slice(endOfNumber);

      let suffix = "";
      let rest = afterNumber;
      const suffixMatch = afterNumber.match(/^([%×\+]+|(?:\s+timesteps)|(?:\s+classes)|(?:\s+model[s]?))/i);
      if (suffixMatch) {
        suffix = suffixMatch[0];
        rest = afterNumber.slice(suffix.length);
      }

      return { prefix, number, suffix, rest, decimalPlaces };
    };

    function useCountUp(target, duration = 1200, started = false) {
      const [current, setCurrent] = useState(0);
      useEffect(() => {
        if (!started) return;
        if (target === 0) return;
        let startTime = null;
        const step = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          setCurrent(Math.floor(eased * target * 100) / 100);
          if (progress < 1) requestAnimationFrame(step);
          else setCurrent(target);
        };
        requestAnimationFrame(step);
      }, [target, duration, started]);
      return current;
    }

    const ResultStat = ({ result, started }) => {

      const count = useCountUp(parsed.number, 1200, started);

        return Object.keys(nextErrors).length === 0;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!validate()) {
          setSubmitState('error');
          return;
        }

        setSubmitState('loading');
        setErrors({});

        try {
          // Send email via EmailJS
          await emailjs.send(
            EMAILJS_SERVICE_ID,
            EMAILJS_TEMPLATE_ID,
            {
              from_name: formData.name,
              from_email: formData.email,
              message: formData.message,
              to_email: 'akshathadungi04@gmail.com',
              reply_to: formData.email,
            },
            EMAILJS_PUBLIC_KEY
          );

          // Also save to localStorage inbox as before
          const msg = {
            id: Date.now().toString(),
            name: formData.name.trim(),
            email: formData.email.trim(),
            message: formData.message.trim(),
            sentAt: new Date().toISOString()
          };
          await window.storage.set("messages:" + msg.id, JSON.stringify(msg));

          playClickSound('publish');
          setSubmitState('success');
          setFormData({ name: '', email: '', message: '' });

          setTimeout(() => setSubmitState('idle'), 5000);

        } catch (err) {
          console.error('EmailJS error:', err);
          setSubmitState('error');
        }
      };

      const handleChange = (event) => {
        const { name, value } = event.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
        setErrors((prev) => {
          const next = { ...prev };
          delete next[name];
          return next;
        });
        if (submitState === "error") {
          setSubmitState("idle");
        }
      };

      const inputStyle = {
        background: "var(--input-bg)",
        borderColor: "var(--input-border)",
        color: "var(--color-text)",
        boxShadow: "none"
      };

      return (
        <section id="contact" className="py-24 px-6 sm:px-10 lg:px-16 max-w-7xl mx-auto relative">
          <img src={DEEP_FIELD} alt="" aria-hidden="true"
            className="absolute inset-0 h-full w-full object-cover z-0 pointer-events-none"
            style={{ opacity: 0.06, mixBlendMode: "screen" }}
            onError={e => {
              e.target.style.display = 'none';
            }}
          />
          <FadeInSection className="relative z-10">
            <h2 className="gradient-text-green-blue font-heading font-bold text-3xl md:text-4xl text-center mb-3">Get In Touch</h2>
            <p className="font-body text-center max-w-lg mx-auto mb-16" style={{ color: "var(--color-text-muted)" }}>
              I'm open to opportunities, collaborations, or just a good tech conversation.
            </p>

            <div className="flex flex-wrap justify-center gap-6 mb-16 max-w-5xl mx-auto">
              {contactDetails.map((item) => {
                const isLink = !!item.href;
                const Card = isLink ? 'a' : 'div';
                return (
                  <Card
                    key={item.label}
                    href={item.href}
                    target={isLink ? "_blank" : undefined}
                    rel={isLink ? "noopener noreferrer" : undefined}
                    onClick={() => isLink && playClickSound('soft')}
                    onDoubleClick={triggerRocky}
                    className={`nebula-card p-6 flex flex-col items-center text-center group ${isLink ? 'btn-liquid cursor-pointer' : ''} w-full sm:w-[280px]`}
                    style={{ textDecoration: 'none' }}
                  >
                    <div style={{
                      width: '36px', height: '36px', borderRadius: '50%', flexShrink: 0,
                      background: `${item.color}15`,
                      border: `1px solid ${item.color}30`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      marginBottom: '16px'
                    }}>
                      <img
                        src={item.logo}
                        alt={item.label}
                        width="18" height="18"
                        style={{
                          objectFit: 'contain',
                          filter: item.label === 'GitHub'
                            ? 'invert(1) brightness(1.5)'
                            : 'none'
                        }}
                        onError={e => {
                          e.target.style.display = 'none';
                        }}
                      />
                    </div>
                    <p className="font-body text-[0.65rem] uppercase tracking-[0.2em] mb-1" style={{ color: "var(--color-subtle)" }}>{item.label}</p>
                    <p className="font-body text-xs break-all" style={{ color: item.color, opacity: 0.9 }}>{item.display}</p>
                  </Card>
                );
              })}
            </div>

            <div className="max-w-3xl mx-auto">
              {submitState === "success" ? (
                <div className="nebula-card p-12 text-center" style={{ animation: 'fade-in-up 0.5s ease' }}>
                  <div className="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6" style={{ background: "rgba(57,255,142,0.1)", color: "#39FF8E", border: '1px solid rgba(57,255,142,0.2)' }}>
                    <IconMail size={32} />
                  </div>
                  <div style={{ color: '#39FF8E', fontFamily: '"Share Tech Mono", monospace', fontSize: '0.85rem', textAlign: 'center', padding: '16px' }}>
                    ✓ Message sent! I'll get back to you soon.
                  </div>
                  <p className="italic mb-6" style={{ color: "var(--color-subtle)" }}>— Akshatha Dungi</p>
                  <button onClick={() => setSubmitState("idle")} className="rounded-full px-6 py-2 text-xs transition-all duration-300" style={{ border: "1px solid rgba(57,255,142,0.5)", color: "#39FF8E" }}>
                    Send another
                  </button>
                </div>
              ) : (
                <div className="nebula-card p-8 lg:p-10">
                  <h3 className="gradient-text-green-blue font-heading font-bold text-xl mb-8">Send a Message</h3>

                  {submitState === "error" && (
                    <div className="rounded-xl p-4 mb-6 border" style={{ background: "rgba(255,77,140,0.1)", borderColor: "rgba(255,77,140,0.3)", color: "#FF4D8C" }}>
                      <p className="font-body text-sm mb-2">Something went wrong. Please check the fields or try again later.</p>
                      <div style={{ color: '#FF4D8C', fontFamily: '"Share Tech Mono", monospace', fontSize: '0.8rem' }}>
                        You can also email me directly at
                        <a href="mailto:akshathadungi04@gmail.com" style={{ color: '#4FC3F7', marginLeft: '4px', textDecoration: 'underline' }}>
                          akshathadungi04@gmail.com
                        </a>
                      </div>
                    </div>
                  )}

                  <form onSubmit={handleSubmit} className="space-y-5">
                    <div className="grid md:grid-cols-2 gap-5">
                      <div className="space-y-1">
                        <label className="text-[0.65rem] uppercase tracking-widest ml-1" style={{ color: 'var(--color-subtle)' }}>Name</label>
                        <input name="name" value={formData.name} onChange={handleChange} placeholder="Your full name" className="w-full rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-1" style={{ ...inputStyle, borderColor: errors.name ? '#FF4D8C' : 'var(--input-border)' }} />
                        {errors.name && <p className="text-[0.65rem] ml-1" style={{ color: "#FF4D8C" }}>{errors.name}</p>}
                      </div>
                      <div className="space-y-1">
                        <label className="text-[0.65rem] uppercase tracking-widest ml-1" style={{ color: 'var(--color-subtle)' }}>Email</label>
                        <input name="email" value={formData.email} onChange={handleChange} placeholder="your@email.com" className="w-full rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-1" style={{ ...inputStyle, borderColor: errors.email ? '#FF4D8C' : 'var(--input-border)' }} />
                        {errors.email && <p className="text-[0.65rem] ml-1" style={{ color: "#FF4D8C" }}>{errors.email}</p>}
                      </div>
                    </div>
                    <div className="space-y-1">
                      <label className="text-[0.65rem] uppercase tracking-widest ml-1" style={{ color: 'var(--color-subtle)' }}>Message</label>
                      <textarea name="message" value={formData.message} onChange={handleChange} placeholder="What can I help you with?" className="w-full min-h-[140px] rounded-xl px-4 py-4 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-1" style={{ ...inputStyle, borderColor: errors.message ? '#FF4D8C' : 'var(--input-border)' }}></textarea>
                      {errors.message && <p className="text-[0.65rem] ml-1" style={{ color: "#FF4D8C" }}>{errors.message}</p>}
                    </div>
                    <button type="submit" disabled={submitState === "loading"} className="btn-liquid w-full py-4 rounded-xl font-heading font-bold tracking-widest transition-all duration-300 disabled:opacity-70 flex items-center justify-center gap-3 mt-4" style={{ background: "linear-gradient(135deg, #39FF8E, #4FC3F7)", color: "#04020E" }}>
                      {submitState === "loading" ? (
                        <>
                          <span className="w-4 h-4 border-2 border-[#04020E] border-t-transparent rounded-full animate-spin"></span>
                          Sending...
                        </>
                      ) : "Send Message"}
                    </button>
                  </form>
                </div>
              )}
            </div>
          </FadeInSection>

          {inboxOpen && (
            <div className="fixed inset-0 z-[9999] overflow-y-auto" style={{ background: "rgba(4, 2, 14, 0.98)", backdropFilter: 'blur(10px)' }}>
              <div className="max-w-5xl mx-auto px-6 py-12 sm:px-10">
                <div className="mb-10 flex items-center justify-between border-b border-white/10 pb-6">
                  <div>
                    <h3 className="gradient-text-green-blue font-heading font-bold text-2xl uppercase tracking-wider">📬 Message Alpha</h3>
                    <p className="font-body text-xs text-[var(--color-subtle)] mt-1">Local backup of incoming transmissions</p>
                  </div>
                  <button onClick={() => setInboxOpen(false)} className="rounded-full border px-6 py-2 text-xs font-heading tracking-widest hover:bg-white/5 transition-colors" style={{ borderColor: "var(--color-border)", color: "var(--color-text)" }}>
                    Close Space
                  </button>
                </div>
                <div className="grid gap-6">
                  {loadingMsgs ? (
                    <div className="nebula-card p-8 text-center font-body">Scanning localStorage...</div>
                  ) : messages.length === 0 ? (
                    <div className="nebula-card p-12 text-center">
                      <div className="text-4xl mb-4 opacity-20">🕳️</div>
                      <p className="font-body text-sm" style={{ color: "var(--color-subtle)" }}>Inbox is currently empty.</p>
                    </div>
                  ) : (
                    messages.map((message) => (
                      <div key={message.id} className="nebula-card p-6 border-l-2" style={{ borderLeftColor: '#39FF8E' }}>
                        <div className="flex flex-wrap items-start justify-between gap-4">
                          <div>
                            <p className="font-heading font-bold text-sm text-[var(--color-text)] uppercase tracking-wide">{message.name}</p>
                            <p className="font-body text-xs" style={{ color: "var(--color-nebula-blue)" }}>{message.email}</p>
                            <p className="font-body text-[0.6rem] mt-1 opacity-40 italic">{new Date(message.sentAt).toLocaleString()}</p>
                          </div>
                          <button onClick={() => handleDelete(message.id)} className="text-[0.65rem] font-heading tracking-widest border border-red-500/30 px-3 py-1 rounded-full text-red-400 hover:bg-red-500/10 transition-colors uppercase">
                            Delete
                          </button>
                        </div>
                        <div className="mt-6 p-4 rounded-lg bg-black/30 border border-white/5">
                          <p className="font-body text-sm leading-relaxed whitespace-pre-wrap" style={{ color: "var(--color-text-muted)" }}>{message.message}</p>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </section>
      );
    };

    const Footer = () => (
      <footer className="py-12 border-t" style={{ borderImage: "linear-gradient(90deg, transparent, var(--color-nebula-violet), transparent) 1" }}>
        <div className="max-w-7xl mx-auto px-6 flex flex-col items-center gap-8">
          <div className="flex gap-8">
            <a href="https://github.com/Akshatha-22" target="_blank" rel="noopener noreferrer" className="text-[var(--color-subtle)] hover:text-[var(--color-primary)] transition-colors duration-300">
              <IconGithub size={20} />
            </a>
            <a href="https://www.linkedin.com/in/akshathadungi2212" target="_blank" rel="noopener noreferrer" className="text-[var(--color-subtle)] hover:text-[var(--color-nebula-blue)] transition-colors duration-300">
              <IconLinkedin size={20} />
            </a>
            <a href="mailto:akshathadungi04@gmail.com" className="text-[var(--color-subtle)] hover:text-[var(--color-nebula-pink)] transition-colors duration-300">
              <IconMail size={20} />
            </a>
          </div>

          <div className="text-center">
            <p className="font-body text-[0.7rem] uppercase tracking-[0.3em] mb-3" style={{ color: "var(--color-subtle)" }}>
              <span style={{ color: "#39FF8E" }}>●</span> Adaptable Developer <span style={{ color: "#4FC3F7" }}>●</span> AI Enthusiast
            </p>
            <p className="font-body text-[0.65rem]" style={{ color: "var(--color-subtle)", opacity: 0.6 }}>
              &copy; 2026 Akshatha Dungi — Built with React, Tailwind & Neural Vibes
            </p>
          </div>
        </div>
      </footer>
    );

    const App = () => {
      const [activeSection, setActiveSection] = useState("hero");
      const [isDark, setIsDark] = useState(() => localStorage.getItem("theme") !== "light");
      const [rockyVisible, setRockyVisible] = useState(false);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }, [isDark]);

      useEffect(() => {
        const spy = () => {
          const sections = ["hero", "about", "experience", "projects", "skills", "certifications", "blog", "contact"];
          const p = window.scrollY + 100;
          for (const sectionName of sections) {
            const element = document.getElementById(sectionName);
            if (element && element.offsetTop <= p && element.offsetTop + element.offsetHeight > p) {
              setActiveSection(sectionName);
            }
          }
        };
        spy();
        window.addEventListener("scroll", spy);
        return () => window.removeEventListener("scroll", spy);
      }, []);

      const toggleTheme = () => setIsDark((p) => !p);

      const triggerRocky = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [220, 330].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = "sine";
            gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.25);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.25 + 0.4);
            osc.start(ctx.currentTime + i * 0.25);
            osc.stop(ctx.currentTime + i * 0.25 + 0.4);
          });
        } catch (error) {
        }
        setRockyVisible(true);
        setTimeout(() => setRockyVisible(false), 2000);
      };

      return (
        <div className="font-body text-[var(--color-text-muted)] min-h-screen relative cosmic-bg">
          <Navbar activeSection={activeSection} isDark={isDark} toggleTheme={toggleTheme} />
          <main>
            <Hero />
            <hr className="section-divider" />
            <About />
            <hr className="section-divider" />
            <Experience />
            <hr className="section-divider" />
            <Projects />
            <hr className="section-divider" />
            <Skills />
            <hr className="section-divider" />
            <Certifications />
            <hr className="section-divider" />
            <Blog />
            <hr className="section-divider" />
            <Contact triggerRocky={triggerRocky} />
          </main>
          <Footer />
          <div style={{ position: "fixed", bottom: "20px", right: "20px", zIndex: 50, cursor: "pointer", opacity: 0.2 }} onClick={triggerRocky} title="♪">
            <span style={{ fontFamily: "Share Tech Mono", fontSize: "10px", color: "#39FF8E" }}>♪</span>
          </div>
          {rockyVisible ? (
            <div style={{ position: "fixed", bottom: "64px", right: "16px", zIndex: 50 }}>
              <div style={{ width: 40, height: 50, position: "relative", animation: "fade-in-up 0.3s ease" }}>
                <div style={{ width: 40, height: 30, background: "#39FF8E", borderRadius: "50% 50% 40% 40%", position: "absolute", bottom: 0, boxShadow: "0 0 15px #39FF8E" }}></div>
                <div style={{ width: 30, height: 25, background: "#4FC3F7", borderRadius: "50%", position: "absolute", top: 0, left: 5, boxShadow: "0 0 10px #4FC3F7" }}></div>
                <div style={{ width: 6, height: 6, background: "#04020E", borderRadius: "50%", position: "absolute", top: 8, left: 9 }}></div>
                <div style={{ width: 6, height: 6, background: "#04020E", borderRadius: "50%", position: "absolute", top: 8, left: 19 }}></div>
                <p style={{ color: "#39FF8E", fontFamily: "Share Tech Mono", fontSize: "8px", marginTop: 54, textAlign: "center", whiteSpace: "nowrap" }}>♪ strum strum ♪</p>
              </div>
            </div>
          ) : null}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    document.addEventListener('click', (e) => {
      const interactive = e.target.closest('a, button, [role="button"]');
      if (interactive && !interactive.dataset.soundHandled) {
        playClickSound('soft');
      }
    });
  </script>
</body>

</html>
