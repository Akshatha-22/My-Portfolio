    window.storage = {
      set: function (key, value) { return Promise.resolve(localStorage.setItem(key, value)); },
      get: function (key) { return Promise.resolve(localStorage.getItem(key)); },
      delete: function (key) { return Promise.resolve(localStorage.removeItem(key)); },
      list: function (prefix) {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.startsWith(prefix)) {
            keys.push(k);
          }
        }
        return Promise.resolve(keys);
      }
    };

    function playClickSound(type = 'soft') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'soft') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'nav') {
          [0, 0.05].forEach((delay, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 600 + i * 200;
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.1, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.07);
            osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.07);
          });
        } else if (type === 'publish') {
          [0, 0.08, 0.16].forEach((delay, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = [440, 550, 660][i];
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.12, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.12);
            osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.12);
          });
        }
      } catch(e) {}
    }

            if (entry.isIntersecting) {
              setVisible(true);
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });
        const current = domRef.current;
        if (current) {
          observer.observe(current);
        }
        return () => {
          if (current) {
            observer.unobserve(current);
          }
        };
      }, []);

      return { ref: domRef, isVisible };

        { name: "LangChain", value: 72 },
        { name: "Docker", value: 78 }

      const [hovered, setHovered] = useState(null);
      const cx = 230, cy = 230, maxR = 140;
      const levels = [20, 40, 60, 80, 100];
      const count = skills.length;
      const angleStep = (2 * Math.PI) / count;
      const startAngle = -Math.PI / 2;

      const polarToXY = (angle, radius) => ({
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      });

      const gridPolygons = levels.map((level) => {
        const r = (level / 100) * maxR;
        const pts = [];
        for (let i = 0; i < count; i++) {
          const a = startAngle + i * angleStep;
          const p = polarToXY(a, r);
          pts.push(`${p.x},${p.y}`);
        }
        return { level, points: pts.join(" ") };
      });

      const axisLines = skills.map((_, i) => {
        const a = startAngle + i * angleStep;
        const end = polarToXY(a, maxR);
        return { x1: cx, y1: cy, x2: end.x, y2: end.y };
      });

      const dataPoints = skills.map((skill, i) => {
        const a = startAngle + i * angleStep;
        const r = (skill.value / 100) * maxR;
        return { ...polarToXY(a, r), skill, index: i };
      });
      const dataPolygon = dataPoints.map((p) => `${p.x},${p.y}`).join(" ");

      const labels = skills.map((skill, i) => {
        const a = startAngle + i * angleStep;
        const labelR = maxR + 30;
        const pos = polarToXY(a, labelR);
        let anchor = "middle";
        if (pos.x < cx - 5) anchor = "end";
        else if (pos.x > cx + 5) anchor = "start";
        let dy = "0.35em";
        if (pos.y < cy - 20) dy = "0.9em";
        if (pos.y > cy + 20) dy = "-0.2em";
        return { ...pos, anchor, dy, skill };
      });

      return (
        <div className="relative mx-auto mb-16" style={{ maxWidth: "460px", width: "100%" }}>
          <svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "auto" }}>
            <defs>
              <filter id="glow-radar">
                <feGaussianBlur stdDeviation="3.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="rgba(57,255,142,0.25)" />
                <stop offset="100%" stopColor="rgba(57,255,142,0.06)" />
              </radialGradient>
            </defs>

            {gridPolygons.map((g) => (
              <polygon
                key={g.level}
                points={g.points}
                fill="none"
                stroke="rgba(199,125,255,0.2)"
                strokeWidth="1"
              />
            ))}

            {axisLines.map((line, i) => (
              <line
                key={i}
                x1={line.x1}
                y1={line.y1}
                x2={line.x2}
                y2={line.y2}
                stroke="rgba(199,125,255,0.12)"
                strokeWidth="1"
              />
            ))}

            <polygon
              points={dataPolygon}
              fill="url(#radarFill)"
              stroke="#39FF8E"
              strokeWidth="2"
              filter="url(#glow-radar)"
              style={{ transition: "all 0.3s ease" }}
            />

            {dataPoints.map((pt) => (
              <circle
                key={pt.index}
                cx={pt.x}
                cy={pt.y}
                r={hovered === pt.index ? 7 : 5}
                fill={hovered === pt.index ? "#39FF8E" : "#0a0618"}
                stroke="#39FF8E"
                strokeWidth="2"
                style={{ cursor: "pointer", transition: "all 0.2s ease", filter: hovered === pt.index ? "drop-shadow(0 0 8px #39FF8E)" : "none" }}
                onMouseEnter={() => setHovered(pt.index)}
                onMouseLeave={() => setHovered(null)}
              />
            ))}

            {labels.map((lb, i) => (
              <text
                key={i}
                x={lb.x}
                y={lb.y}
                textAnchor={lb.anchor}
                dy={lb.dy}
                fill="var(--color-text)"
                fontSize="11"
                fontFamily="'Share Tech Mono', monospace"
                style={{ textShadow: "0 0 12px rgba(57,255,142,0.8), 0 0 24px rgba(57,255,142,0.4)" }}
              >
                {lb.skill.name}
              </text>
            ))}

            {levels.map((level) => {
              const r = (level / 100) * maxR;
              return (
                <text
                  key={level}
                  x={cx + 4}
                  y={cy - r + 1}
                  fill="var(--color-text-muted)"

            <div

              style={{
                left: `${(dataPoints[hovered].x / 460) * 100}%`,

            </div>

        </div>
      );

                      value={formData.tag}
                      onChange={(e) => setFormData((prev) => ({ ...prev, tag: e.target.value }))}
                      className="w-full rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-2"
                      style={inputStyle}
                    >
                      {Object.keys(BLOG_TAG_STYLES).map((tag) => (
                        <option key={tag} value={tag}>{tag}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <textarea
                      value={formData.body}
                      onChange={(e) => setFormData((prev) => ({ ...prev, body: e.target.value }))}
                      placeholder="Write your post..."
                      className="w-full min-h-[180px] rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-2"
                      style={inputStyle}
                    ></textarea>
                  </div>
                  <button
                    type="submit"
                    disabled={!formData.title.trim() || !formData.body.trim()}
                    onClick={() => playClickSound('publish')}
                    className="btn-liquid w-full py-3 rounded-xl font-heading font-bold transition-all duration-300 disabled:opacity-50"
                    data-sound-handled="true"
                    style={{ background: "linear-gradient(135deg, #C77DFF, #FF4D8C)", color: "#04020E" }}
                  >
                    Publish
                  </button>
                </form>
              </div>
            )}

            {loading ? (
              <p className="text-center" style={{ color: "var(--color-text-muted)" }}>Loading posts...</p>
            ) : posts.length === 0 ? (
              <p className="text-center" style={{ color: "var(--color-text-muted)" }}>No posts yet.</p>
            ) : (
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                {posts.map((post) => {
                  const tagStyle = BLOG_TAG_STYLES[post.tag] || BLOG_TAG_STYLES.Thoughts;
                  return (
                    <div key={post.id} className="nebula-card p-6 flex flex-col h-full relative group" style={{ borderTop: `3px solid ${tagStyle.color}` }}>
                      <div className="flex items-start justify-between gap-2 mb-3">
                        <h3 className="font-heading font-bold text-base" style={{ color: "var(--color-text)" }}>{post.title}</h3>
                        {isAuthor && (
                          <button
                            onClick={() => handleDelete(post.id)}
                            className="opacity-0 group-hover:opacity-100 transition-opacity duration-200 p-1 rounded hover:bg-[rgba(255,77,140,0.15)] flex-shrink-0"
                            style={{ color: "#FF4D8C" }}
                            aria-label="Delete post"
                          >
                            <IconTrash size={14} />
                          </button>
                        )}
                      </div>
                      <div className="flex items-center gap-3 mb-4">
                        <span className="font-body text-xs px-3 py-1 rounded-full border" style={{ background: tagStyle.bg, color: tagStyle.color, borderColor: tagStyle.border }}>{post.tag}</span>
                        <span className="font-body text-xs" style={{ color: "var(--color-subtle)" }}>{post.date}</span>
                      </div>
                      <div
                        className="font-body text-sm leading-relaxed whitespace-pre-line"
                        style={{
                          color: "var(--color-text-muted)",
                          maxHeight: expandedPosts[post.id] ? "2000px" : "4.5rem",
                          overflow: "hidden",
                          transition: "max-height 0.4s ease"
                        }}
                      >
                        {post.body}
                      </div>
                      <button
                        onClick={() => setExpandedPosts((prev) => ({ ...prev, [post.id]: !prev[post.id] }))}
                        style={{
                          background: "none",
                          border: "none",
                          padding: 0,
                          marginTop: "0.5rem",
                          color: "var(--color-primary)",
                          fontFamily: '"Share Tech Mono", monospace',
                          fontSize: "0.8rem",
                          cursor: "pointer"
                        }}
                      >
                        {expandedPosts[post.id] ? "show less" : "...read more"}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </FadeInSection>
        </section>
      );
    };

    const Contact = ({ triggerRocky }) => {
      const [formData, setFormData] = useState({ name: "", email: "", message: "" });
      const [errors, setErrors] = useState({});
      const [submitState, setSubmitState] = useState("idle");
      const [inboxOpen, setInboxOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [loadingMsgs, setLoadingMsgs] = useState(false);

      const loadMessages = async () => {
        setLoadingMsgs(true);
        try {
          const keys = await window.storage.list("messages:");
          const rawMessages = await Promise.all(keys.map((key) => window.storage.get(key)));
          const parsedMessages = rawMessages
            .map((raw) => {
              try {
                return JSON.parse(raw);
              } catch (error) {
                return null;
              }
            })
            .filter(Boolean)
            .sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));
          setMessages(parsedMessages);
        } finally {
          setLoadingMsgs(false);
        }
      };

      useEffect(() => {
        const handleShortcut = (event) => {
          if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === "m") {
            event.preventDefault();
            setInboxOpen(true);
            loadMessages();
          }
        };
        window.addEventListener("keydown", handleShortcut);
        return () => window.removeEventListener("keydown", handleShortcut);
      }, []);

      const handleDelete = async (id) => {
        await window.storage.delete("messages:" + id);
        loadMessages();
      };

      const validate = () => {
        const nextErrors = {};
        if (!formData.name.trim()) nextErrors.name = "Name is required.";
        if (!formData.email.trim()) nextErrors.email = "Email is required.";
        if (formData.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) nextErrors.email = "Enter a valid email address.";
        if (!formData.message.trim()) nextErrors.message = "Message is required.";
        setErrors(nextErrors);
        return Object.keys(nextErrors).length === 0;
      };

      const handleSubmit = async (event) => {
        event.preventDefault();
        if (!validate()) {
          setSubmitState("error");
          return;
        }
        setSubmitState("loading");
        const msg = {
          id: Date.now().toString(),
          name: formData.name.trim(),
          email: formData.email.trim(),
          message: formData.message.trim(),
          sentAt: new Date().toISOString()
        };
        try {
          await window.storage.set("messages:" + msg.id, JSON.stringify(msg));
          setSubmitState("success");
          setFormData({ name: "", email: "", message: "" });
          setErrors({});
        } catch (error) {
          setSubmitState("error");
        }
      };

      const handleChange = (event) => {
        const { name, value } = event.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
        setErrors((prev) => {
          const next = { ...prev };
          delete next[name];
          return next;
        });
        if (submitState === "error") {
          setSubmitState("idle");
        }
      };

      const inputStyle = {
        background: "var(--input-bg)",
        borderColor: "var(--input-border)",
        color: "var(--color-text)",
        boxShadow: "none"
      };

      return (
        <section id="contact" className="py-24 px-6 sm:px-10 lg:px-16 max-w-7xl mx-auto relative">
          <img src={DEEP_FIELD} alt="" aria-hidden="true" className="absolute inset-0 h-full w-full object-cover z-0 pointer-events-none" style={{ opacity: 0.06, mixBlendMode: "screen" }} />
          <FadeInSection className="relative z-10">
            <h2 className="gradient-text-green-blue font-heading font-bold text-3xl md:text-4xl text-center mb-3">Get In Touch</h2>
            <p className="font-body text-center max-w-lg mx-auto mb-16" style={{ color: "var(--color-text-muted)" }}>
              I'm open to opportunities, collaborations, or just a good tech conversation.
            </p>

            <div className="grid lg:grid-cols-2 gap-12">
              <div className="space-y-4">
                {[
                  { icon: <IconMail />, label: "Email", value: "akshatha@example.com", bg: "rgba(57,255,142,0.1)", color: "#39FF8E", glow: "glow-green" },
                  { icon: <IconLinkedin />, label: "LinkedIn", value: "linkedin.com/in/akshatha", bg: "rgba(79,195,247,0.1)", color: "#4FC3F7", glow: "glow-blue" },
                  { icon: <IconGithub />, label: "GitHub", value: "github.com/akshatha", bg: "rgba(199,125,255,0.1)", color: "#C77DFF", glow: "glow-violet" },
                  { icon: <IconMapPin />, label: "Location", value: "India", bg: "rgba(255,209,102,0.1)", color: "#FFD166", glow: "" }
                ].map((item) => (
                  <div key={item.label} className="nebula-card p-5 flex items-center group cursor-pointer" onDoubleClick={triggerRocky}>
                    <div className={`p-3 rounded-full transition-all duration-300 ${item.glow}`} style={{ background: item.bg, color: item.color }}>
                      {item.icon}
                    </div>
                    <div className="ml-4">
                      <p className="font-body text-xs uppercase tracking-wider mb-0.5" style={{ color: "var(--color-subtle)" }}>{item.label}</p>
                      <p className="font-body text-sm transition-colors duration-300 group-hover:text-[var(--color-text)]" style={{ color: "var(--color-text-muted)" }}>{item.value}</p>
                    </div>
                  </div>
                ))}
              </div>

              {submitState === "success" ? (
                <div className="nebula-card p-8 text-center">
                  <div className="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full" style={{ background: "rgba(57,255,142,0.1)", color: "#39FF8E" }}>
                    <IconMail size={28} />
                  </div>
                  <h3 className="gradient-text-green-blue font-heading font-bold text-xl mb-2">Message received! I'll get back to you shortly.</h3>
                  <p className="italic mb-6" style={{ color: "var(--color-subtle)" }}>— Akshatha Dungi</p>
                  <button onClick={() => setSubmitState("idle")} className="rounded-xl px-5 py-3 transition-all duration-300" style={{ border: "1px solid rgba(57,255,142,0.5)", color: "#39FF8E" }}>
                    Send another
                  </button>
                </div>
              ) : (
                <div className="nebula-card p-8">
                  <h3 className="gradient-text-green-blue font-heading font-bold text-xl mb-6">Send a Message</h3>
                  {submitState === "error" && Object.keys(errors).length > 0 ? (
                    <div className="rounded-xl p-4 mb-4 border" style={{ background: "rgba(255,77,140,0.1)", borderColor: "rgba(255,77,140,0.3)", color: "#FF4D8C" }}>
                      Please fix the highlighted fields and try again.
                    </div>
                  ) : null}
                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                      <input name="name" value={formData.name} onChange={handleChange} placeholder="Your name" className="w-full rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-2" style={inputStyle} />
                      {errors.name ? <p className="mt-1 text-xs" style={{ color: "#FF4D8C" }}>{errors.name}</p> : null}
                    </div>
                    <div>
                      <input name="email" value={formData.email} onChange={handleChange} placeholder="Email address" className="w-full rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-2" style={inputStyle} />
                      {errors.email ? <p className="mt-1 text-xs" style={{ color: "#FF4D8C" }}>{errors.email}</p> : null}
                    </div>
                    <div>
                      <textarea name="message" value={formData.message} onChange={handleChange} placeholder="Your message" className="w-full min-h-[150px] rounded-xl px-4 py-3 font-body text-sm border transition-all duration-200 focus:outline-none focus:ring-2" style={inputStyle}></textarea>
                      {errors.message ? <p className="mt-1 text-xs" style={{ color: "#FF4D8C" }}>{errors.message}</p> : null}
                    </div>
                    <button type="submit" onClick={() => playClickSound('soft')} disabled={submitState === "loading"} className="btn-liquid w-full py-3 rounded-xl font-heading font-bold transition-all duration-300 disabled:opacity-70" style={{ background: "linear-gradient(135deg, #39FF8E, #4FC3F7)", color: "#04020E" }} data-sound-handled="true">
                      {submitState === "loading" ? "Sending..." : "Send Message"}
                    </button>
                  </form>
                </div>
              )}
            </div>
          </FadeInSection>

          {inboxOpen ? (
            <div className="fixed inset-0 z-[9999] overflow-y-auto" style={{ background: "var(--color-bg)" }}>
              <div className="max-w-5xl mx-auto px-6 py-10 sm:px-10">
                <div className="mb-8 flex items-center justify-between gap-4">
                  <h3 className="gradient-text-green-blue font-heading font-bold text-2xl">📬 Message Inbox</h3>
                  <button onClick={() => setInboxOpen(false)} className="rounded-full border px-4 py-2 text-sm" style={{ borderColor: "var(--color-border)", color: "var(--color-text)" }}>
                    Close
                  </button>
                </div>
                <div className="space-y-4">
                  {loadingMsgs ? (
                    <div className="nebula-card p-6">Loading messages...</div>
                  ) : messages.length === 0 ? (
                    <div className="nebula-card p-6">No messages received yet.</div>
                  ) : (
                    messages.map((message) => (
                      <div key={message.id} className="nebula-card p-6">
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <p className="font-heading font-bold text-[var(--color-text)]">{message.name}</p>
                            <p className="font-body text-sm" style={{ color: "var(--color-nebula-blue)" }}>{message.email}</p>
                            <p className="font-body text-xs mt-1" style={{ color: "var(--color-subtle)" }}>{new Date(message.sentAt).toLocaleString()}</p>
                          </div>
                          <button onClick={() => handleDelete(message.id)} className="text-sm" style={{ color: "#FF4D8C" }}>
                            Delete
                          </button>
                        </div>
                        <p className="mt-4 font-body leading-relaxed" style={{ color: "var(--color-text-muted)" }}>{message.message}</p>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          ) : null}
        </section>
      );
    };

    const Footer = () => (
      <footer className="py-8 text-center" style={{ borderTop: "1px solid transparent", borderImage: "linear-gradient(90deg, transparent, #C77DFF, transparent) 1" }}>
        <p className="font-body text-xs" style={{ color: "var(--color-subtle)" }}>
          <span style={{ color: "#39FF8E" }}>●</span> <span style={{ color: "#C77DFF" }}>●</span> <span style={{ color: "#4FC3F7" }}>●</span>{" "}
          &copy; 2026 Akshatha Dungi — Built with React & Tailwind
        </p>
      </footer>
    );

    const App = () => {
      const [activeSection, setActiveSection] = useState("hero");
      const [isDark, setIsDark] = useState(() => localStorage.getItem("theme") !== "light");
      const [rockyVisible, setRockyVisible] = useState(false);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }, [isDark]);

      useEffect(() => {
        const spy = () => {
          const sections = ["hero", "about", "experience", "projects", "skills", "certifications", "blog", "contact"];
          const p = window.scrollY + 100;
          for (const sectionName of sections) {
            const element = document.getElementById(sectionName);
            if (element && element.offsetTop <= p && element.offsetTop + element.offsetHeight > p) {
              setActiveSection(sectionName);
            }
          }
        };
        spy();
        window.addEventListener("scroll", spy);
        return () => window.removeEventListener("scroll", spy);
      }, []);

      const toggleTheme = () => setIsDark((p) => !p);

      const triggerRocky = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [220, 330].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = "sine";
            gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.25);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.25 + 0.4);
            osc.start(ctx.currentTime + i * 0.25);
            osc.stop(ctx.currentTime + i * 0.25 + 0.4);
          });
        } catch (error) {
        }
        setRockyVisible(true);
        setTimeout(() => setRockyVisible(false), 2000);
      };

      return (
        <div className="font-body text-[var(--color-text-muted)] min-h-screen relative cosmic-bg">
          <Navbar activeSection={activeSection} isDark={isDark} toggleTheme={toggleTheme} />
          <main>
            <Hero />
            <hr className="section-divider" />
            <About />
            <hr className="section-divider" />
            <Experience />
            <hr className="section-divider" />
            <Projects />
            <hr className="section-divider" />
            <Skills />
            <hr className="section-divider" />
            <Certifications />
            <hr className="section-divider" />
            <Blog />
            <hr className="section-divider" />
            <Contact triggerRocky={triggerRocky} />
          </main>
          <Footer />
          <div style={{ position: "fixed", bottom: "20px", right: "20px", zIndex: 50, cursor: "pointer", opacity: 0.2 }} onClick={triggerRocky} title="♪">
            <span style={{ fontFamily: "Share Tech Mono", fontSize: "10px", color: "#39FF8E" }}>♪</span>
          </div>
          {rockyVisible ? (
            <div style={{ position: "fixed", bottom: "64px", right: "16px", zIndex: 50 }}>
              <div style={{ width: 40, height: 50, position: "relative", animation: "fade-in-up 0.3s ease" }}>
                <div style={{ width: 40, height: 30, background: "#39FF8E", borderRadius: "50% 50% 40% 40%", position: "absolute", bottom: 0, boxShadow: "0 0 15px #39FF8E" }}></div>
                <div style={{ width: 30, height: 25, background: "#4FC3F7", borderRadius: "50%", position: "absolute", top: 0, left: 5, boxShadow: "0 0 10px #4FC3F7" }}></div>
                <div style={{ width: 6, height: 6, background: "#04020E", borderRadius: "50%", position: "absolute", top: 8, left: 9 }}></div>
                <div style={{ width: 6, height: 6, background: "#04020E", borderRadius: "50%", position: "absolute", top: 8, left: 19 }}></div>
                <p style={{ color: "#39FF8E", fontFamily: "Share Tech Mono", fontSize: "8px", marginTop: 54, textAlign: "center", whiteSpace: "nowrap" }}>♪ strum strum ♪</p>
              </div>
            </div>
          ) : null}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    document.addEventListener('click', (e) => {
      const interactive = e.target.closest('a, button, [role="button"]');
      if (interactive && !interactive.dataset.soundHandled) {
        playClickSound('soft');
      }
    });
  </script>
</body>
</html>
