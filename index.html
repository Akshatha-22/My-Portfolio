<body>
  <div id="root"></div>

  <script>
    window.storage = {
      set: function(key, value) { return Promise.resolve(localStorage.setItem(key, value)); },
      get: function(key) { return Promise.resolve(localStorage.getItem(key)); },
      delete: function(key) { return Promise.resolve(localStorage.removeItem(key)); },
      list: function(prefix) {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.startsWith(prefix)) keys.push(k);
        }
        return Promise.resolve(keys);
      }
    };
  </script>
  <script src="three-bg.js"></script>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef } = React;

    // ── ICONS ──
    const IconGithub = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></svg>);
    const IconLinkedin = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" /></svg>);
    const IconMail = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>);
    const IconMapPin = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>);
    const IconExternalLink = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>);
    const IconAward = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" /><path d="m9 12 2 2 4-4" /></svg>);
    const IconBriefcase = ({ size = 20, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></svg>);
    const IconMenu = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>);
    const IconClose = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>);
    const IconSun = ({ size = 16, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>);
    const IconMoon = ({ size = 16, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>);
    const IconPlay = ({ size = 18, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 18 18" fill="currentColor" className={className}><polygon points="5,3 15,9 5,15" /></svg>);
    const IconPause = ({ size = 18, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 18 18" fill="currentColor" className={className}><rect x="4" y="3" width="3.5" height="12" rx="1" /><rect x="10.5" y="3" width="3.5" height="12" rx="1" /></svg>);

    // ── HOOKS ──
    const useFadeIn = () => {
      const domRef = useRef();
      const [isVisible, setVisible] = useState(false);
      useEffect(() => {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => { if (entry.isIntersecting) { setVisible(true); observer.unobserve(entry.target); } });
        }, { threshold: 0.15 });
        const { current } = domRef;
        if (current) observer.observe(current);
        return () => { if (current) observer.unobserve(current); };
      }, []);
      return { ref: domRef, isVisible };
    };
    const FadeInSection = ({ children, className = "" }) => {
      const { ref, isVisible } = useFadeIn();
      return <div ref={ref} className={`fade-in-section ${isVisible ? 'is-visible' : ''} ${className}`}>{children}</div>;
    };

    // ── THEME TOGGLE ──
    const ThemeToggle = ({ isDark, toggleTheme }) => (
      <button onClick={toggleTheme} aria-label="Toggle Theme" style={{ width:'52px',height:'28px',backgroundColor:isDark?'#0A0618':'#FFF0D6',border:`1px solid ${isDark?'#39FF8E':'#008C5A'}`,borderRadius:'9999px',position:'relative',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 6px'}} className="hover:scale-105 transition-all duration-300">
        <div style={{position:'absolute',left:isDark?'2px':'26px',top:'2px',width:'22px',height:'22px',borderRadius:'50%',backgroundColor:isDark?'#39FF8E':'#008C5A',transition:'left 300ms ease, background-color 300ms ease',zIndex:1}}></div>
        <IconMoon size={12} className="relative z-0 text-[#008C5A]" />
        <IconSun size={12} className="relative z-0 text-[#39FF8E]" />
      </button>
    );

    // ── NAVBAR ──
    const Navbar = ({ activeSection, isDark, toggleTheme }) => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const navLinks = ['Hero','About','Experience','Projects','Skills','Certifications','Contact'];
      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
      const scrollTo = (id) => { const el = document.getElementById(id.toLowerCase()); if(el){el.scrollIntoView({behavior:'smooth'});setMobileMenuOpen(false);} };
      return (
        <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled?'bg-[var(--nav-bg)] backdrop-blur-md py-3 shadow-lg':'bg-transparent py-6'}`}>
          <div className="max-w-7xl mx-auto px-6 lg:px-12 flex justify-between items-center">
            <div className="font-heading font-bold text-2xl tracking-tighter logo-gradient cursor-pointer" onClick={()=>scrollTo('hero')}>AD</div>
            <div className="hidden md:flex space-x-8 items-center">
              {navLinks.map(link => {
                const isActive = activeSection === link.toLowerCase();
                return <button key={link} onClick={()=>scrollTo(link)} className={`text-sm font-body font-medium transition-colors hover:text-[var(--color-primary)] ${isActive?'text-[var(--color-primary)]':'text-[var(--color-text-muted)]'}`}>
                  {isActive && <span className="inline-block w-1.5 h-1.5 rounded-full bg-[var(--color-primary)] mr-2 glow-pulse"></span>}
                  {link}
                </button>;
              })}
              <div className="ml-4 border-l border-[var(--color-border)] pl-4"><ThemeToggle isDark={isDark} toggleTheme={toggleTheme} /></div>
            </div>
            <div className="flex items-center gap-4 md:hidden">
              <ThemeToggle isDark={isDark} toggleTheme={toggleTheme} />
              <button className="text-[var(--color-text-muted)] hover:text-[var(--color-primary)]" onClick={()=>setMobileMenuOpen(!mobileMenuOpen)}>{mobileMenuOpen?<IconClose />:<IconMenu />}</button>
            </div>
          </div>
          <div className={`md:hidden absolute top-full left-0 w-full bg-[var(--drawer-bg)] backdrop-blur-md transition-all duration-300 overflow-hidden ${mobileMenuOpen?'max-h-screen py-4 border-b border-[var(--color-border)]':'max-h-0 py-0'}`}>
            <div className="flex flex-col space-y-4 px-6">{navLinks.map(link => <button key={link} onClick={()=>scrollTo(link)} className={`text-left text-lg font-medium font-body ${activeSection===link.toLowerCase()?'text-[var(--color-primary)]':'text-[var(--color-text-muted)]'}`}>{link}</button>)}</div>
          </div>
        </nav>
      );
    };

    // ── HERO ──
    const Hero = () => {
      const canvasRef = useRef();
      const [showRocky, setShowRocky] = useState(false);
      useEffect(() => { if (canvasRef.current) { const cleanup = createStarfield(canvasRef.current); return cleanup; } }, []);
      const playRockyBeep = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [0, 0.15].forEach(delay => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.value = 800; gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.12);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.12);
          });
        } catch(e){}
      };
      const handleRocky = () => { setShowRocky(true); playRockyBeep(); setTimeout(()=>setShowRocky(false), 2200); };
      return (
        <section id="hero" className="relative min-h-screen flex items-center pt-20 overflow-hidden px-6 lg:px-12 max-w-7xl mx-auto">
          <canvas ref={canvasRef} style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',zIndex:0,pointerEvents:'none'}} />
          {/* Nebula Blobs */}
          <div className="absolute top-[15%] right-[10%] w-[400px] h-[400px] bg-[var(--color-nebula-violet)] opacity-20 filter blur-[100px] rounded-full animate-float-shape-1"></div>
          <div className="absolute bottom-[10%] right-[15%] w-[350px] h-[350px] bg-[var(--color-nebula-pink)] opacity-15 filter blur-[90px] rounded-full animate-float-shape-2"></div>
          <div className="absolute top-[20%] left-[5%] w-[300px] h-[300px] bg-[var(--color-primary)] opacity-10 filter blur-[100px] rounded-full animate-float-shape-1" style={{animationDelay:'-2s'}}></div>
          <div className="absolute bottom-[15%] left-[10%] w-[320px] h-[320px] bg-[var(--color-nebula-gold)] opacity-10 filter blur-[95px] rounded-full animate-float-shape-2" style={{animationDelay:'-4s'}}></div>

          <div className="relative z-10 max-w-3xl">
            <p className="hero-text-1 mission-label mb-4">MISSION LOG #001 — CREW MANIFEST</p>
            <h1 className="hero-text-2 font-heading font-bold mb-4 name-gradient" style={{fontSize:'clamp(42px,6vw,76px)',lineHeight:'1.1'}}>Akshatha Dungi</h1>
            <h2 className="hero-text-3 font-body text-[var(--color-text)] text-lg md:text-xl lg:text-2xl mb-6 tracking-wide">
              Software Developer · Backend Specialist · AI Curious<span className="cursor-blink text-[var(--color-primary)]">|</span>
            </h2>
            <p className="hero-text-4 text-[var(--color-text-muted)] md:text-lg max-w-2xl leading-relaxed mb-10">I build scalable backends, experiment with LLMs, and thrive on adaptability. Merging solid software engineering principles with dynamic new technologies.</p>
            <div className="hero-buttons flex flex-wrap gap-4">
              <button onClick={()=>document.getElementById('projects').scrollIntoView({behavior:'smooth'})} className="bg-[var(--btn-primary-bg)] text-[var(--btn-primary-text)] font-heading font-semibold px-8 py-3 rounded-full hover:brightness-110 hover:scale-[1.02] transition-all duration-200 shadow-lg glow-pulse">View Projects</button>
              <a href="#" className="border-2 border-[var(--btn-ghost-border)] text-[var(--btn-ghost-text)] font-body font-medium px-8 py-3 rounded-full hover:opacity-80 transition-all duration-200">Download Resume</a>
            </div>
          </div>
          <div className="absolute bottom-8 right-8 z-20 cursor-pointer select-none" onClick={handleRocky}><span className="text-xs text-[var(--color-primary)] opacity-5">♪ strum strum ♪</span></div>
          {showRocky && <div className="fixed bottom-20 right-12 z-[999] rocky-alien"><div className="rocky-body"><div className="rocky-arm rocky-arm-l"></div><div className="rocky-arm rocky-arm-r"></div></div><p className="text-center text-[var(--color-nebula-gold)] text-xs mt-2 font-heading">ROCKY!</p></div>}
        </section>
      );
    };

    // ── ABOUT ──
    const About = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null); const imgRef = useRef(null); const planetCanvasRef = useRef(null);
      useEffect(() => { audioRef.current = new Audio('HUS(허밍어반스테레오) - BANANA SHAKE (SPED UP) [Visualizer].mp3'); audioRef.current.loop = true; return () => { if(audioRef.current){audioRef.current.pause();audioRef.current=null;} }; }, []);
      useEffect(() => { if (planetCanvasRef.current) { const cleanup = createPlanet(planetCanvasRef.current); return cleanup; } }, []);
      const togglePlay = () => {
        if (!audioRef.current || !imgRef.current) return;
        if (isPlaying) { audioRef.current.pause(); imgRef.current.classList.remove('spinning'); }
        else { audioRef.current.play(); imgRef.current.classList.add('spinning'); }
        setIsPlaying(!isPlaying);
      };
      return (
        <section id="about" className="py-24 px-6 lg:px-12 max-w-7xl mx-auto relative">
          <FadeInSection>
            <div className="grid md:grid-cols-2 gap-12 items-center">
              <div className="flex flex-col items-center md:items-start order-2 md:order-1 justify-center">
                <div className="flex flex-col items-center gap-4 relative">
                  <canvas ref={planetCanvasRef} width="300" height="300" style={{position:'absolute',top:'-10px',left:'50%',transform:'translateX(-50%)',zIndex:0,pointerEvents:'none',opacity:0.75}} />
                  <div className="relative z-10"><img ref={imgRef} src="mei.jpeg" alt="Profile" className={`w-[280px] h-[280px] rounded-full object-cover border-4 border-[var(--color-primary)] ${isPlaying?'spinning':'not-spinning'}`} style={{boxShadow:'0 0 24px var(--color-primary)'}} /></div>
                  <button onClick={togglePlay} className="w-[52px] h-[52px] mt-4 rounded-full flex items-center justify-center transition-all duration-200 hover:scale-[1.08] z-10 glow-pulse" style={{background:'var(--color-primary)',color:'var(--color-bg)'}}>{isPlaying ? <IconPause /> : <IconPlay className="ml-1" />}</button>
                  <div className="flex items-center gap-2 z-10" style={{opacity:isPlaying?1:0,height:'20px',transition:'opacity 400ms'}}><span className="w-[6px] h-[6px] rounded-full bg-[var(--color-primary)] animate-pulse" /><span className="text-[12px] italic text-[var(--color-text-muted)] font-body">♪ BANANA SHAKE</span></div>
                </div>
              </div>
              <div className="order-1 md:order-2">
                <h2 className="font-heading font-bold text-3xl md:text-4xl mb-6 heading-about">Mission Profile</h2>
                <div className="space-y-4 text-[var(--color-text-muted)] leading-relaxed font-body">
                  <p>I'm the kind of developer who thrives on change. The tech landscape evolves rapidly, and I believe the best solutions come from being adaptable.</p>
                  <p>One day I'm deep in <span className="text-[var(--color-text)] font-semibold">Java code</span> building robust architectures... The next, establishing <span className="text-[var(--color-text)] font-semibold">LLM pipelines</span> to solve complex logical problems.</p>
                  <div className="mt-8 bg-[var(--about-card-bg)] border border-[var(--color-border)] rounded-xl p-6 shadow-lg relative z-20 scanlines">
                    <h3 className="text-[var(--color-primary)] font-heading font-semibold mb-3 text-sm tracking-widest uppercase">Field Notes</h3>
                    <ul className="space-y-3">
                      <li className="flex items-start"><span className="mr-3">⭐</span><span>Fast learner, fueled by curiosity (and nebula cosmic events).</span></li>
                      <li className="flex items-start"><span className="mr-3">🧩</span><span>I treat every new technology like a puzzle to solve.</span></li>
                      <li className="flex items-start"><span className="mr-3">🎯</span><span>Focused on the end goal, flexible on the path to get there.</span></li>
                      <li className="flex items-start"><span className="mr-3">🤖</span><span>Continuously integrating AI to optimize my workflow.</span></li>
                    </ul>
                  </div>
                  <p className="italic text-[var(--color-subtle)] mt-6">💼 Open to roles where adaptability is valued as much as expertise.</p>
                </div>
              </div>
            </div>
          </FadeInSection>
        </section>
      );
    };

    // ── EXPERIENCE ──
    const Experience = () => {
      const jobs = [
        { role:"Software Developer", company:"Tech Solutions Inc.", period:"2024 - Present", description:"Scaling backend infrastructure using Spring Boot, PostgreSQL, and AWS. Integrating LLM pipelines via LangChain to automate internal tools.", color:"#39FF8E" },
        { role:"Junior Backend Engineer", company:"Innovate AI", period:"2023 - 2024", description:"Built and maintained REST APIs in Python (FastAPI). Containerized applications with Docker to streamline deployment.", color:"#FF4D8C" },
        { role:"Software Engineering Intern", company:"Startup Co.", period:"2022 - 2023", description:"Contributed to front-end development using React and Tailwind CSS. Developed internal admin dashboards.", color:"#FFD166" }
      ];
      return (
        <section id="experience" className="py-24 px-6 lg:px-12 max-w-7xl mx-auto">
          <FadeInSection>
            <div className="text-center mb-16">
              <h2 className="font-heading font-bold text-3xl md:text-4xl mb-2 heading-experience">Mission History</h2>
              <p className="text-[var(--color-subtle)] font-body">My professional journey</p>
            </div>
            <div className="max-w-4xl mx-auto relative cursor-default">
              <div className="absolute left-[15px] md:left-1/2 top-0 bottom-0 w-px hidden md:block" style={{background:'linear-gradient(to bottom, var(--color-nebula-gold), transparent)'}}></div>
              <div className="space-y-12 relative">
                {jobs.map((job, idx) => (
                  <div key={idx} className={`relative flex flex-col md:flex-row gap-8 items-start justify-between ${idx%2===0?'md:flex-row-reverse':''}`}>
                    <div className="absolute left-0 md:left-1/2 w-8 h-8 rounded-full bg-[var(--color-surface)] border-2 flex items-center justify-center -translate-x-1/2 z-10 hidden md:flex" style={{borderColor:job.color,boxShadow:`0 0 12px ${job.color}`}}>
                      <div className="w-3 h-3 rounded-full" style={{backgroundColor:job.color}}></div>
                    </div>
                    <div className="w-full md:w-[45%] bg-[var(--color-surface)] border border-[var(--color-border)] rounded-2xl p-6 transition-colors shadow-lg relative group" style={{borderTop:`2px solid ${job.color}`}}>
                      <h3 className="font-heading font-bold text-xl text-[var(--color-text)]">{job.role}</h3>
                      <div className="flex justify-between items-center mb-4 mt-1">
                        <p className="text-[var(--color-text-muted)] font-body">{job.company}</p>
                        <span className="text-xs font-heading px-3 py-1 rounded-full hidden md:inline-block" style={{backgroundColor:`${job.color}15`, color:job.color}}>{job.period}</span>
                      </div>
                      <p className="text-[var(--color-text-muted)] leading-relaxed text-sm font-body opacity-90">{job.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </FadeInSection>
        </section>
      );
    };

    // ── PROJECTS ──
    const Projects = () => {
      const [filter, setFilter] = useState('All');
      const projects = [
        { title:"MicroCommerce", desc:"Scalable Spring Boot microservice backend for a modern e-commerce platform.", tags:["Java","Spring Boot"], category:"Backend", color:"#4FC3F7" },
        { title:"LLM Pipeline Toolkit", desc:"Utility suite for chaining dynamic LLM prompts and managing context windows.", tags:["Python","LangChain"], category:"AI/ML", color:"#39FF8E" },
        { title:"DevPortal API", desc:"Comprehensive REST API with role-based auth and automated Swagger docs.", tags:["FastAPI","Redis"], category:"Frontend", color:"#C77DFF" }
      ];
      const filtered = filter==='All'?projects:projects.filter(p=>p.category===filter);
      return (
        <section id="projects" className="py-24 px-6 lg:px-12 max-w-7xl mx-auto">
          <FadeInSection>
            <div className="text-center mb-12">
              <h2 className="font-heading font-bold text-3xl md:text-4xl mb-2 heading-projects">Mission Dossiers</h2>
              <p className="text-[var(--color-subtle)] font-body">Things I've built</p>
            </div>
            <div className="flex flex-wrap justify-center gap-3 mb-12">
              {['All','Backend','AI/ML','Frontend'].map(f => <button key={f} onClick={()=>setFilter(f)} className={`px-5 py-2 rounded-full text-sm font-heading transition-all ${filter===f?'bg-[var(--color-primary)] text-[var(--color-bg)]':'bg-[var(--color-surface)] border border-[var(--color-border)] text-[var(--color-text-muted)]'}`}>{f}</button>)}
            </div>
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filtered.map((project, idx) => (
                <div key={idx} className="group bg-[var(--color-surface)] border border-[var(--color-border)] rounded-2xl p-6 transition-all duration-300 hover:-translate-y-2 flex flex-col h-full relative overflow-hidden" 
                  style={{'--hover-color':project.color}} onMouseEnter={(e)=>e.currentTarget.style.boxShadow=`0 0 20px ${project.color}33`} onMouseLeave={(e)=>e.currentTarget.style.boxShadow=''}>
                  <div className="classified-watermark">CLASSIFIED</div>
                  <h3 className="font-heading font-bold text-xl text-[var(--color-text)] mb-3 relative z-10">{project.title}</h3>
                  <p className="text-[var(--color-text-muted)] mb-6 flex-grow font-body relative z-10">{project.desc}</p>
                  <div className="flex flex-wrap gap-2 mb-6 relative z-10">{project.tags.map(tag => <span key={tag} className="text-xs font-body bg-[var(--tech-tag-bg)] text-[var(--tech-tag-text)] px-3 py-1 rounded-full">{tag}</span>)}</div>
                  <div className="flex items-center gap-4 mt-auto pt-4 border-t border-[var(--color-border)] relative z-10"><IconGithub size={18} /><IconExternalLink size={18} /></div>
                </div>
              ))}
            </div>
          </FadeInSection>
        </section>
      );
    };

    // ── SKILLS ──
    const Skills = () => {
      const solarRef = useRef();
      const categories = [
        { title:"Languages", color:"#4FC3F7", skills:["Java","Python","JavaScript","SQL"] },
        { title:"Frameworks", color:"#39FF8E", skills:["Spring Boot","FastAPI","React","Docker"] },
        { title:"AI & ML", color:"#C77DFF", skills:["LangChain","Prompting","HuggingFace"] },
        { title:"Cloud", color:"#FFD166", skills:["AWS","CI/CD","REST APIs","Postman"] }
      ];
      useEffect(() => { if (solarRef.current) { const cleanup = createSolarSystem(solarRef.current); return cleanup; } }, []);
      return (
        <section id="skills" className="py-24 px-6 lg:px-12 max-w-7xl mx-auto relative">
          <FadeInSection>
            <div className="text-center mb-8"><h2 className="font-heading font-bold text-3xl md:text-4xl mb-2 heading-skills">Crew Capabilities</h2><p className="text-[var(--color-subtle)] font-body">What I bring to the table</p></div>
            <div className="w-full mb-8 h-[220px]"><canvas ref={solarRef} className="w-full h-full" /></div>
            <div className="grid md:grid-cols-2 gap-6 lg:gap-8">
              {categories.map((cat, idx) => (
                <div key={idx} className="bg-[var(--about-card-bg)] border border-[var(--color-border)] rounded-2xl p-6 transition-all hover:border-[--cat-color]" style={{'--cat-color':cat.color, borderLeft:`4px solid ${cat.color}`}}>
                  <h3 className="font-heading font-bold text-lg mb-5" style={{color:cat.color}}>{cat.title}</h3>
                  <div className="flex flex-wrap gap-3">{cat.skills.map(s => <div key={s} className="flex items-center gap-2 bg-[var(--skill-pill-bg)] border border-[var(--skill-pill-border)] text-[var(--color-text)] px-4 py-2 rounded-full text-sm font-body transition-transform hover:scale-105"><span className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:cat.color, boxShadow:`0 0 6px ${cat.color}`}} />{s}</div>)}</div>
                </div>
              ))}
            </div>
          </FadeInSection>
        </section>
      );
    };

    // ── CERTIFICATIONS ──
    const Certifications = () => {
      const certCols = ["#39FF8E", "#4FC3F7", "#C77DFF"];
      const certs = [
        { title:"OCP: Java SE 11", issuer:"Oracle" }, { title:"AWS Cloud Practitioner", issuer:"Amazon" }, { title:"Deep Learning Spec.", issuer:"Coursera" }
      ];
      return (
        <section id="certifications" className="py-24 px-6 lg:px-12 max-w-7xl mx-auto overflow-hidden">
          <FadeInSection>
            <div className="text-center mb-12"><h2 className="font-heading font-bold text-3xl md:text-4xl mb-2 heading-certs">Mission Credentials</h2><p className="text-[var(--color-subtle)] font-body">Verifiable credentials</p></div>
            <div className="flex md:grid md:grid-cols-3 gap-6 overflow-x-auto pb-8 hide-scrollbar snap-x touch-pan-x">
              {certs.map((c, i) => (
                <div key={i} className="min-w-[280px] md:min-w-0 snap-center bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl p-6 shadow-lg" style={{borderLeft:`4px solid ${certCols[i]}`}}>
                  <h3 className="font-heading font-bold text-[var(--color-text)] text-base md:text-lg mb-2">{c.title}</h3>
                  <p className="text-[var(--color-text-muted)] font-body text-sm">{c.issuer}</p>
                </div>
              ))}
            </div>
          </FadeInSection>
        </section>
      );
    };

    // ── CONTACT ──
    const Contact = () => {
      const [formData, setFormData] = useState({name:'',email:'',message:''});
      const [state, setState] = useState('idle');
      const handleSubmit = async (e) => {
        e.preventDefault(); setState('loading');
        try { await window.storage.set('messages:'+Date.now(), JSON.stringify({...formData, sentAt:new Date().toISOString()})); setState('success'); setFormData({name:'',email:'',message:''}); }
        catch(e) { setState('error'); }
      };
      const inputCls = "w-full bg-[var(--input-bg)] border border-[var(--input-border)] rounded-[10px] px-[14px] py-[10px] text-[var(--color-text)] font-body focus:ring-1 focus:ring-[var(--color-primary)] focus:outline-none transition-all";
      return (
        <section id="contact" className="py-24 px-6 lg:px-12 max-w-7xl mx-auto relative">
          <FadeInSection>
            <div className="text-center mb-16"><h2 className="font-heading font-bold text-3xl md:text-4xl mb-3 heading-contact">Open Transmission</h2><p className="text-[var(--color-text-muted)] font-body">Ready for cosmic collaboration.</p></div>
            <div className="grid lg:grid-cols-2 gap-12">
              <div className="space-y-4">
                {[{ic:<IconMail />,l:"Email",v:"akshatha@example.com"}, {ic:<IconLinkedin />,l:"LinkedIn",v:"linkedin.com/in/akshatha"}, {ic:<IconGithub />,l:"GitHub",v:"github.com/akshatha"}].map((it,i)=>(
                  <div key={i} className="flex items-center p-5 bg-[var(--color-surface)] border border-[var(--color-border)] rounded-2xl hover:border-[var(--color-primary)] transition-all group">
                    <div className="bg-[var(--tech-tag-bg)] p-3 rounded-full text-[var(--color-primary)] group-hover:shadow-[0_0_12px_var(--color-primary)]">{it.ic}</div>
                    <div className="ml-4"><p className="text-sm text-[var(--color-subtle)] font-heading">{it.l}</p><p className="text-[var(--color-text-muted)] font-body">{it.v}</p></div>
                  </div>
                ))}
              </div>
              <div className="bg-[var(--contact-form-bg)] border border-[var(--color-border)] p-8 rounded-[16px] scanlines">
                {state==='success' ? <div className="text-center py-4"><h3 className="font-heading text-[var(--color-primary)] text-xl">Transmission Received.</h3><button onClick={()=>setState('idle')} className="mt-4 text-sm text-[var(--color-primary)] underline">Send another</button></div> :
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="text" name="name" value={formData.name} onChange={(e)=>setFormData({...formData,name:e.target.value})} className={inputCls} placeholder="Name" required />
                  <input type="email" name="email" value={formData.email} onChange={(e)=>setFormData({...formData,email:e.target.value})} className={inputCls} placeholder="Email" required />
                  <textarea name="message" value={formData.message} onChange={(e)=>setFormData({...formData,message:e.target.value})} className={`${inputCls} h-32`} placeholder="Transmission detail..." required></textarea>
                  <button type="submit" disabled={state==='loading'} className="w-full bg-[var(--btn-primary-bg)] text-[var(--btn-primary-text)] font-heading font-bold rounded-[10px] py-3 hover:brightness-110 active:scale-95 transition-all glow-pulse">{state==='loading'?'Transmitting...':'Transmit Message'}</button>
                </form>}
              </div>
            </div>
          </FadeInSection>
        </section>
      );
    };

    const Footer = () => <footer className="py-8 text-center mt-12 border-t border-[var(--color-subtle)] opacity-50"><p className="text-sm font-body">&copy; 2026 Akshatha Dungi — Built aboard the Hail Mary</p></footer>;

    const App = () => {
      const [active, setActive] = useState('hero');
      const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') !== 'light');
      useEffect(() => { document.documentElement.setAttribute('data-theme', isDark?'dark':'light'); localStorage.setItem('theme', isDark?'dark':'light'); }, [isDark]);
      useEffect(() => {
        const spy = () => {
          const s = ['hero','about','experience','projects','skills','certifications','contact'];
          const p = window.scrollY + 120;
          for(const n of s){ const e=document.getElementById(n); if(e && e.offsetTop <= p && e.offsetTop + e.offsetHeight > p) setActive(n); }
        };
        window.addEventListener('scroll', spy); return () => window.removeEventListener('scroll', spy);
      }, []);
      return (<div className="font-body text-[var(--color-text-muted)] min-h-screen relative selection:bg-[var(--color-primary)] selection:bg-opacity-20">
        <Navbar activeSection={active} isDark={isDark} toggleTheme={()=>setIsDark(!isDark)} />
        <main><Hero /><About /><Experience /><Projects /><Skills /><Certifications /><Contact /></main><Footer />
      </div>);
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
